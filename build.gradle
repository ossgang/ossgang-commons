buildscript {
    project.ext['CERN_VM'] = System.getProperty('CERN_TECHNET_VM') ?: System.getenv('CERN_TECHNET_VM') ?: project.hasProperty('CERN_TECHNET_VM') ?: false
    project.ext['DEPLOYMENT'] = System.getProperty('DEPLOYMENT') ?: false

    repositories {
        if (project['CERN_VM']) {
            maven { url = 'https://artifactory.cern.ch/ds-jcenter' }
            maven { url = 'https://artifactory.cern.ch/development' }
            maven { url = 'https://artifactory.cern.ch/gradle-plugins' }
        } else {
            gradlePluginPortal()
        }
    }

    dependencies {
        classpath 'com.github.jk1:gradle-license-report:3.1.5'
        classpath 'io.github.gradle-nexus:publish-plugin:2.0.0'
        classpath 'biz.aQute.bnd:biz.aQute.bnd.gradle:7.4.0' // OSGi
    }
}

apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'biz.aQute.bnd.builder' // OSGi

group = project['POM.groupId']

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.named('compileJava') {
    options.release = 11
}

tasks.named('compileTestJava') {
    // JUnit 6 requires Java 17; only the tests are compiled for it, the library itself stays on Java 11
    options.release = 17
}

repositories {
    if (project['CERN_VM']) {
        maven { url = 'https://artifactory.cern.ch/ds-jcenter' }
        maven { url = 'https://artifactory.cern.ch/development' }
    } else {
        mavenCentral()
    }
}

configurations {
    mockitoAgent
}

// versions aligned with the CERN third-party BASELINE (thirdparty.xml)
dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    mockitoAgent('org.mockito:mockito-core:5.23.0') {
        transitive = false
    }
}

wrapper {
    gradleVersion = '9.6.1'
    distributionType = Wrapper.DistributionType.ALL
    distributionSha256Sum = '61ba77b3ff7167e60962763eb4bae79db7120c189b9544358d0ade3c1e712a83'
}

jar {
    // OSGi
    bundle {
        bnd([
                'Bundle-Vendor'  : 'ossgang',
                '-exportcontents': '*',
                '-buildpath'     : '' // no dependencies
        ])
    }
}

test {
    useJUnitPlatform()
    // load mockito as java agent explicitly (dynamic agent loading is deprecated in recent JDKs)
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

jacoco {
    toolVersion = "0.8.16"
}

jacocoTestReport {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/report.xml")
        html.required = true
        csv.required = false
    }
}

javadoc { options.encoding = "UTF-8" }

if (!tasks.names.contains("javadocJar")) {
    tasks.register('javadocJar', Jar) {
        archiveClassifier = 'javadoc'
        from javadoc
    }
}

if (!tasks.names.contains("sourcesJar")) {
    tasks.register('sourcesJar', Jar) {
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

if (!project['CERN_VM']) {
    println 'Applying licensing report'
    apply plugin: 'com.github.jk1.dependency-license-report'

    licenseReport {
        renderers = [new com.github.jk1.license.render.InventoryHtmlReportRenderer()]
        filters = [new com.github.jk1.license.filter.LicenseBundleNormalizer()]
    }
}

if (project['DEPLOYMENT']) {
    println 'Applying deployment scripts'
    apply from: 'https://raw.githubusercontent.com/ossgang/gradle-scripts/master/deployment/deploy-to-maven-central.gradle'
}
